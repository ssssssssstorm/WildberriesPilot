[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marketplacepilot"
version = "0.1.0"
description = "Демо AI-менеджера Wildberries в Telegram"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.22,<4",
    "aiosqlite>=0.21,<1",
    "fastapi>=0.115,<1",
    "python-dotenv>=1.1,<2",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "httpx>=0.28,<1",
    "ruff>=0.12,<1",
]

[project.scripts]
marketplacepilot = "marketplacepilot.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/marketplacepilot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
